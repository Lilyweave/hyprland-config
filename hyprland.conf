# ───────────── macOS-style Hyprland ─────────────
# Needs: waybar rofi nwg-dock-hyprland swaync hyprpaper grim slurp wl-clipboard
#        cliphist brightnessctl playerctl wlogout kitty nautilus polkit-gnome
# Theme: whitesur-gtk-theme whitesur-icon-theme whitesur-cursor-theme inter-font

monitor = , preferred, auto, 1

$terminal = kitty
$files    = nautilus
$launcher = rofi -show drun -theme ~/.config/rofi/spotlight.rasi
$shots    = ~/Pictures/Screenshots

# ── Autostart ──
exec-once = waybar
exec-once = hyprpaper
exec-once = nwg-dock-hyprland -d -i 52 -mb 10
exec-once = swaync
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = mkdir -p $shots
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'WhiteSur-Dark'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'WhiteSur-dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'WhiteSur-cursors'
exec-once = gsettings set org.gnome.desktop.interface font-name 'Inter 11'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# ── Environment ──
env = XCURSOR_THEME,WhiteSur-cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,WhiteSur-cursors
env = HYPRCURSOR_SIZE,24
env = GTK_THEME,WhiteSur-Dark

# ── Look ──
general {
    gaps_in = 6
    gaps_out = 12, 12, 12, 12
    border_size = 1
    col.active_border   = rgba(ffffff40)
    col.inactive_border = rgba(ffffff14)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 10
        passes = 3
        noise = 0.02
        vibrancy = 0.25
        brightness = 1.0
        contrast = 1.0
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 40
        render_power = 3
        offset = 0 14
        color = rgba(00000066)
        color_inactive = rgba(00000033)
    }
}

# Blur behind bar / dock / launcher / notifications.
# Syntax changed in Hyprland 0.53 — use whichever matches your version:
#   new: layerrule = blur on, match:namespace ^(waybar)$
#   old: layerrule = blur, waybar
layerrule = blur on, match:namespace ^(waybar)$
layerrule = blur on, match:namespace ^(rofi)$
layerrule = blur on, match:namespace ^(swaync-control-center)$
layerrule = blur on, match:namespace ^(swaync-notification-window)$
layerrule = blur on, match:namespace ^(nwg-dock)$

animations {
    enabled = true
    bezier = ease,   0.25, 0.10, 0.25, 1.00
    bezier = spring, 0.34, 1.30, 0.64, 1.00
    animation = windows,     1, 5, spring, popin 88%
    animation = windowsOut,  1, 4, ease,   popin 90%
    animation = fade,        1, 5, ease
    animation = border,      1, 6, ease
    animation = layers,      1, 5, ease, fade
    animation = workspaces,  1, 6, ease, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}

# ── Input (macOS-style trackpad) ──
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        scroll_factor = 0.4
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}

# 3-finger swipe between workspaces ("Spaces")
gesture = 3, horizontal, workspace

# ── Keybinds: SUPER acts as ⌘ ──
$mod = SUPER

bind = $mod, SPACE,  exec, $launcher                  # Spotlight
bind = $mod, Q,      killactive                       # Quit app
bind = $mod, W,      killactive                       # Close window
bind = $mod, RETURN, exec, $terminal
bind = $mod, E,      exec, $files                     # Finder
bind = $mod, TAB,    cyclenext                        # App switcher
bind = $mod, TAB,    bringactivetotop
bind = $mod SHIFT, TAB, cyclenext, prev
bind = $mod, V,      exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/spotlight.rasi | cliphist decode | wl-copy
bind = $mod CTRL, F, fullscreen, 0                    # Full screen
bind = $mod CTRL, Q, exec, loginctl lock-session      # Lock screen
bind = $mod ALT,  ESCAPE, exec, hyprctl kill          # Force quit (click a window)
bind = $mod, F,      togglefloating                   # Toggle floating
bind = $mod, M,      movetoworkspacesilent, special:minimized   # Minimize
bind = $mod SHIFT, M, togglespecialworkspace, minimized         # Show minimized

# Screenshots (⌘⇧3 / ⌘⇧4 / ⌘⇧5)
bind = $mod SHIFT, 3, exec, grim - | tee $shots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
bind = $mod SHIFT, 4, exec, grim -g "$(slurp)" - | tee $shots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
bind = $mod SHIFT, 5, exec, grim -g "$(slurp)" - | wl-copy

# Spaces: Ctrl+arrows / Ctrl+number
bind = CTRL, LEFT,  workspace, e-1
bind = CTRL, RIGHT, workspace, e+1
bind = CTRL, 1, workspace, 1
bind = CTRL, 2, workspace, 2
bind = CTRL, 3, workspace, 3
bind = CTRL, 4, workspace, 4
bind = CTRL, 5, workspace, 5
bind = CTRL SHIFT, 1, movetoworkspace, 1
bind = CTRL SHIFT, 2, movetoworkspace, 2
bind = CTRL SHIFT, 3, movetoworkspace, 3
bind = CTRL SHIFT, 4, movetoworkspace, 4
bind = CTRL SHIFT, 5, movetoworkspace, 5

# Focus / move
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Mouse: ⌘+drag to move, ⌘+right-drag to resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,         exec, playerctl play-pause
bindl  = , XF86AudioNext,         exec, playerctl next
bindl  = , XF86AudioPrev,         exec, playerctl previous

# ── Optional: make every window float like macOS ──
# (very different feel from tiling — uncomment to try)
# Hyprland 0.53+: windowrule = float on, match:class .*
# older:          windowrulev2 = float, class:.*
